<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register to Fandom - Legenda Nusantara</title>
    <link rel="stylesheet" href="assets/css/login.css">
</head>
<body>
    <div class="header">
        <h1 class="header-title">Register to Fandom</h1>
    </div>
    <button class="back-button">
        <a href="jawa/index.html">← BACK</a>
    </button>
    <div class="container">
        <div class="login-wrapper">
            <div class="social-section">
                <h2>Register with account</h2>
                <div class="social-buttons">
                    <button class="social-btn google-btn">
                        <span class="icon">G</span>
                        Register WITH GOOGLE
                    </button>
                    <button class="social-btn facebook-btn">
                        <span class="icon">f</span>
                        Register WITH FACEBOOK
                    </button>
                </div>
            </div>

            <div class="form-section">
                <h2>Register</h2>
                <form>
                    <div class="form-group">
                        <label for="email">Email</label>
                        <input type="email" id="email" placeholder="Email" required>
                    </div>
                    <div class="form-group">
                        <label for="username">Username</label>
                        <input type="text" id="username" placeholder="Username" required>
                    </div>
                    <div class="form-group">
                        <label for="password">Password</label>
                        <input type="password" id="password" placeholder="Username" required>
                    </div>
                    <button type="submit" class="signin-btn">Register</button>
                </form>
                <div class="register-link">
                    Sudah punya akun? <a href="login.html">Login sekarang</a>
                </div>
            </div>
        </div>
    </div>

    <div class="footer">
        <div class="footer-content">
            Copyright © 2025 Nusantara Wiki. Powered by Kelompok 14. All Rights Reserved. 
        </div>
    </div>
</body>
</html>
